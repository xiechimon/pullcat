services:
  pullcat-server:
    image: ghcr.io/xiechimon/pullcat-server:latest
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pullcat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PULLCAT_BASE_URL: ${PULLCAT_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  pullcat-web:
    image: ghcr.io/xiechimon/pullcat-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - pullcat-server

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pullcat
      MYSQL_USER: pullcat
      MYSQL_PASSWORD: pullcat123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:

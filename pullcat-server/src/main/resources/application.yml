spring:
  application:
    name: pullcat

  # --- AI 模型配置 ---
  # 需要 DeepSeek API Key，获取地址：https://platform.deepseek.com/api_keys
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat

  # --- Redis 配置 ---
  # Redis 主要用于缓存与限流。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  # --- MySQL 配置 ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pullcat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- OAuth2 登录配置 ---
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,repo
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          github:
            user-name-attribute: login

# =============================================================================
# pullcat 自定义配置
# =============================================================================

pullcat:
  # --- GitHub 配置 ---
  github:
    # Personal Access Token，可选。OAuth 登录后无需配置，无用户 session 时（webhook）需要。
    # 生成地址：https://github.com/settings/tokens
    token: ${GITHUB_TOKEN:}
    # GitHub App 配置（OAuth App 升级为 GitHub App 后填写）
    # App ID，在 GitHub App 设置页的 App ID 字段获取
    app-id: ${GITHUB_APP_ID:}
    # 私钥（PKCS#8 PEM 格式）
    # 从 GitHub App 设置页下载私钥（.pem 文件），执行以下命令转为 PKCS#8：
    #   openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in private-key.pem -out private-key-pkcs8.pem
    # 将 private-key-pkcs8.pem 内容（含首尾 -----BEGIN/END PRIVATE KEY-----）设为此环境变量
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    # Webhook Secret，在 GitHub App 设置页配置的 Webhook Secret 值
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}

  # --- LLM 模型配置 ---
  llm:
    # 轻量模型：用于摘要、测试覆盖等快速分析
    light-model: deepseek-v4-flash
    # 重量模型：用于风险、质量、一致性等深度分析
    heavy-model: deepseek-v4-flash

  # --- 限流配置 ---
  rate-limit:
    # 全局默认：60 请求/分钟
    default-max: 60
    default-window-seconds: 60
    # 审查创建：100 请求/分钟 (放宽以便本地测试)
    review-create-max: 100
    review-create-window-seconds: 60
    # 统计查询：30 请求/分钟
    stats-max: 30
    stats-window-seconds: 60

  # --- 超时配置 ---
  timeout:
    github-seconds: 30
    llm-seconds: 120


# --- 服务器配置 ---
server:
  port: 8080

# 静默 SSE 断连时的 Broken pipe 日志噪音
logging:
  level:
    org.apache.catalina.connector.CoyoteAdapter: WARN

# --- Actuator 配置 ---
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
